<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <!-- Same outer gradient as arsenal.svg -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
  </defs>

  <!-- Outer canvas (same as arsenal) -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Terminal chrome (exact same fills/strokes as arsenal) -->
  <rect x="90" y="70" width="1320" height="360" rx="10" fill="#0e121a" stroke="#2f3a4d" stroke-width="1.5"/>
  <rect x="90" y="70" width="1320" height="42" rx="10" fill="#161b26"/>
  <rect x="90" y="99" width="1320" height="13" fill="#161b26"/>
  <circle cx="123" cy="91" r="7" fill="#ff6b63" opacity="0.9"/>
  <circle cx="149" cy="91" r="7" fill="#f0c14a" opacity="0.9"/>
  <circle cx="175" cy="91" r="7" fill="#56d364" opacity="0.9"/>
  <text x="750" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9aa0a8" text-anchor="middle" letter-spacing="2">saurav@devops:~$</text>

  <!-- Terminal content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="130" y="185" font-size="21" fill="#9aa0a8">
      <tspan fill="#4C9AE0">$</tspan> whoami
    </text>
    <text x="130" y="235" font-size="40" fill="#e8eaed" font-weight="700" letter-spacing="0.5">
      Saurav_Rana
    </text>

    <text x="130" y="300" font-size="21" fill="#9aa0a8">
      <tspan fill="#4C9AE0">$</tspan> cat motto.txt
    </text>
    <text x="130" y="345" font-size="27" fill="#e8eaed" letter-spacing="0.3">
      Building for 5 nines, until DNS happens<tspan id="cursor" fill="#4C9AE0">|</tspan>
    </text>

    <animate xlink:href="#cursor" attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <text x="1370" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9aa0a8" text-anchor="end" letter-spacing="1.5">[DEVOPS_ENGINEER::CLOUD]</text>
</svg>
